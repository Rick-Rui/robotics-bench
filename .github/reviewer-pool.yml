# Reviewer pool config for the parallel review model.
#
# Two reviewers are assigned up front and review in PARALLEL:
#
#   domain slot — field-routed:
#     For a task in field <F>, the candidate pool is reviewers_by_field[<F>].
#     If that pool is empty, the picker falls back to `reviewers_domain_backup`,
#     then to `reviewers_technical` as a last resort.
#     Field is parsed from the task folder of the older nested layout; a case
#     at tasks/<case>/ has no field and goes straight to the fallback.
#
#   technical slot:
#     Candidate pool is `reviewers_technical`. Picked excluding the domain
#     reviewer so the two slots are always distinct people.
#     (Formerly named the "general" slot / `reviewers_general` — the scripts
#     still read the old key as a fallback during the transition.)
#
# Both slots use least-loaded selection (by active review requests on open
# `new task` PRs). The PR author is always excluded.
#
#   final slot — final decision:
#     Assigned only once BOTH the domain and technical reviewers have approved
#     (labels `domain review ✅` and `technical review ✅`). Least-loaded from
#     `reviewers_final`, excluding the two parallel reviewers.
#
# Pool: the four maintainers listed below fill every slot. The pickers exclude
# the PR author and the other slots' reviewers, so the domain, technical and
# final reviewers are three different people.

# ────────────────────────────────────────────────────────────────────
# domain slot: cases are not routed by field, so the domain slot is filled
#   from `reviewers_domain_backup`.
# ────────────────────────────────────────────────────────────────────

reviewers_by_field: {}

# ────────────────────────────────────────────────────────────────────
# domain-slot backup: used when a task's field has no assigned reviewer
#   above (currently every field).
# ────────────────────────────────────────────────────────────────────

reviewers_domain_backup:
  - leeyyi
  - lwhere1314
  - yanhuachisha
  - yin-ls

# ────────────────────────────────────────────────────────────────────
# technical slot: cross-domain reviewers
#   Also the last-resort fallback for the domain slot.
# ────────────────────────────────────────────────────────────────────

reviewers_technical:
  - leeyyi
  - lwhere1314
  - yanhuachisha
  - yin-ls

# ────────────────────────────────────────────────────────────────────
# final slot: final decision (assigned after both parallel approvals)
# ────────────────────────────────────────────────────────────────────

reviewers_final:
  - leeyyi
  - lwhere1314
  - yanhuachisha
  - yin-ls
