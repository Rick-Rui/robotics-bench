name: Case Kit
# The robot-independent case kit (tools/case-kit): unit tests, the example case's vendored copies, the CPU gate on
# the example, and the CPU gate on every changed task built with the kit (a task with a casekit/ directory).
# The gate builds the task's two images, runs Nop and the Oracle, and checks isolation, envelope, recording and replay.
# Nothing here uses a secret.
on:
  workflow_dispatch:
  pull_request:
    paths: ["tools/case-kit/**", "docs/CASE.md", ".github/workflows/case-kit.yml", "tasks/**"]
  push:
    branches: [main]
    paths: ["tools/case-kit/**", "docs/CASE.md", ".github/workflows/case-kit.yml"]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Unit tests
        working-directory: tools/case-kit
        run: python -m unittest discover -s tests -v
      - name: Example in sync
        run: python tools/case-kit/sync.py --check tools/case-kit/example/gantry-push
      - name: Gate on the example
        run: python tools/case-kit/gate.py tools/case-kit/example/gantry-push --json case-gate-example.json
      - name: Gate on changed tasks built with the kit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          fail=0
          for t in $(git diff --name-only "$BASE" HEAD -- tasks | awk -F/ '$1=="tasks" { if ($2 ~ /^(life|physical|earth|mathematical|engineering)-sciences$/) { if (NF>=5) print $1"/"$2"/"$3"/"$4 } else if (NF>=3) print $1"/"$2 }' | sort -u); do
            [ -d "$t" ] && [ -n "$(find "$t" -type d -name casekit -print -quit)" ] || continue
            echo "::group::$t"
            python tools/case-kit/sync.py --check "$t" || fail=1
            python tools/case-kit/gate.py "$t" --json "case-gate-$(basename "$t").json" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: case-gate
          path: case-gate-*.json
          if-no-files-found: ignore
