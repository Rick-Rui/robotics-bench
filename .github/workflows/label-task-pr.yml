name: Label Task PR

# Applies the tier label (`tier:cpu` / `tier:gpu` / `tier:real`) and `new task` / `task fix` the moment a PR opens (and keeps it right as
# the diff changes), so a fix PR is routed to the task's original reviewers
# without waiting for a maintainer to run /overview.
#
# Metadata only — this reads the PR's file list through the API and never
# checks out or executes anything from the PR, which is what the security
# gate (#1670) permits to run automatically on fork PRs. The task-processing
# workflows (validation, static checks, rubric review, overview) stay behind
# their maintainer-triggered slash commands.
#
# `task fix` → chains task-fix-pr-reviewers.yml (workflow_dispatch, because a
# label applied with GITHUB_TOKEN raises no `labeled` event). `new task` →
# nothing more here: reviewer assignment for new tasks stays gated behind the
# mechanical checks in checks-passed.yml.

on:
  pull_request_target:
    # edited: a changed base branch changes the diff, and with it the tier (stacked tier PRs)
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to (re)label"
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: label-task-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Base repo's default branch only — never the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/scripts/classify_task_pr.py
            ci_checks/check-task-tier.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # tier:cpu / tier:gpu / tier:real — which tier of its task the PR is (docs/COMMANDS.md).
      # The label decides which slash commands work on the PR, so drafts get it too.
      - name: Tier label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          TIER=$(python3 ci_checks/check-task-tier.py "$PR_NUMBER" --repo "$REPO" --tier)
          echo "Tier: ${TIER:-none}"
          for t in cpu gpu real; do
            if [ "$t" = "$TIER" ]; then
              gh label create "tier:$t" --repo "$REPO" --force --color "$(python3 ci_checks/check-task-tier.py 0 --color $t)" \
                --description "This PR is the $t tier of its task (docs/COMMANDS.md)" 2>/dev/null || true
              gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "tier:$t"
            else
              gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "tier:$t" 2>/dev/null || true
            fi
          done

      - name: Classify and label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "PR #$PR_NUMBER is a draft; labelling when it's marked ready."
            exit 0
          fi
          LABEL=$(python3 .github/scripts/classify_task_pr.py --repo "$REPO" --pr "$PR_NUMBER")
          CURRENT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if [ -z "$LABEL" ]; then
            echo "No task content added or modified — no task label."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "new task" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "task fix" 2>/dev/null || true
            exit 0
          fi
          echo "Classified as: $LABEL"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL"
          if [ "$LABEL" = "task fix" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "new task" 2>/dev/null || true
            # Route the fix to the task's original reviewers (idempotent: it
            # skips a PR that already has a slot marker).
            gh workflow run task-fix-pr-reviewers.yml --repo "$REPO" -f pr_number="$PR_NUMBER" \
              && echo "Chained task-fix-pr-reviewers for PR #$PR_NUMBER" \
              || echo "::warning::Could not chain task-fix-pr-reviewers for PR #$PR_NUMBER"
          else
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "task fix" 2>/dev/null || true
          fi
