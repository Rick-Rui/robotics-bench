name: GPU Tools Tests
on:
  workflow_dispatch:
  pull_request:
    paths: ["ci_checks/check-task-tier.py", ".github/scripts/tier_command.py", "tools/anchor-gpu/**", "tools/isaac-model-comparison/**", "tools/isaac-remote/**", ".github/workflows/gpu-*.yml"]
  push:
    branches: [main]
    paths: ["ci_checks/check-task-tier.py", ".github/scripts/tier_command.py", "tools/anchor-gpu/**", "tools/isaac-model-comparison/**", "tools/isaac-remote/**", ".github/workflows/gpu-*.yml"]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tools/anchor-gpu/tests -v

  model-adapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r tools/isaac-model-comparison/requirements-host.txt
      - run: python -m pytest -q tools/isaac-model-comparison
      - run: python -m unittest discover -s tools/isaac-remote -p 'test_*.py' -v
