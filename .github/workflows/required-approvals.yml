name: Required Approvals Gate

# Posts the commit status `merge-gate/required-approvals`, which the
# default-branch ruleset requires. Task PRs (changing tasks/, lite/ or adapters/) stay blocked until
# their assigned human reviewers approve the current head; PRs listed in
# .github/required-approvers.json need the named logins. Other PRs pass.
# See .github/scripts/required_approvals.py for the exact rules.
#
# Every trigger runs this file and the config from the default branch, never PR
# code: pull_request_target and workflow_run use the base revision, and the
# script only calls the GitHub API.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    # Review submitted (Review Labels Trigger) or reviewers (re)assigned.
    workflows: ["Review Labels Trigger", "Reassign Reviewer", "PR Status & Reviewer Assignment"]
    types: [completed]
  schedule:
    # Fallback for dismissed reviews and missed events; GitHub may delay it.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: required-approvals-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/required-approvers.json
            .github/scripts/required_approvals.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Evaluate and post status
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            python3 .github/scripts/required_approvals.py --pr "$PR_NUMBER"
          else
            python3 .github/scripts/required_approvals.py --all-open
          fi
