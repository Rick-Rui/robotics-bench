name: GPU Task Controls

# /validate on a tier:gpu PR (a task whose task.toml has validate_env = "ziwu-gpu", or the GPU tier
# of a multi-tier task: tier = gpu), called by validate-task.yml. All orchestration code comes from
# main; the task comes from the PR commit pinned when the maintainer commented.
#
# Three stages; a failed stage stops the next one:
#   verify  - no GPU host involved: static checks passed on this commit, similarity check, and
#             tools/isaac-remote/preflight.py (GPU tier files, host/service.json contract, runtime
#             archive manifest and URL, the Harbor tasks assemble)
#   deploy  - install the task revision on the GPU pool host (POST /deployments: the host checks
#             the digest, fetches the pinned runtime archive and runs the platform installer; no
#             task code runs). Only a verified revision is deployed.
#   accept  - two different GPUs of the pool, chosen per run (tools/isaac-remote/lanes.py pick 2), in
#             parallel, each: Oracle, then Nop, through the full online path
#             (Actions CPU agent -> relay -> RTX 4090 -> network-denied replay); accept.py over
#             the four controls; the result row for the /validate comment and the acceptance
#             record artifact

on:
  workflow_call:
    inputs:
      pr_number: {type: string, required: true}
      head_sha: {type: string, required: true}
      task_path: {type: string, required: true}
      tier: {type: string, required: false, default: ''}
  workflow_dispatch:
    inputs:
      pr_number: {type: string, required: true, description: "PR number"}
      head_sha: {type: string, required: true, description: "PR commit to validate"}
      task_path: {type: string, required: true, description: "Task path"}
      tier: {type: string, required: false, default: '', description: "gpu: GPU tier of a multi-tier task"}

permissions:
  contents: read
  checks: read

env:
  GPU_RELAY: ${{ vars.GPU_RELAY }}   # user@host of the GPU pool relay
  GPU_POOL_LANES: ${{ vars.GPU_POOL_LANES }}   # GPUs of the pool this repository uses; empty = 0,1,2,3

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      similarity: ${{ steps.similarity.outputs.success }}
      verified: ${{ steps.verify.outputs.verified }}
      deployed: ${{ steps.deploy.outputs.deployed }}
      slug: ${{ steps.slug.outputs.slug }}
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - id: slug
        env:
          TASK_PATH: ${{ inputs.task_path }}
        run: |
          [[ "$TASK_PATH" =~ ^(tasks|lite)/[A-Za-z0-9_./-]+$ && "$TASK_PATH" != *..* ]] || { echo "Invalid task path"; exit 1; }
          echo "slug=$(basename "$TASK_PATH")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: base, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Choose two GPUs for the controls
        id: lanes
        run: echo "lanes=$(python base/tools/isaac-remote/lanes.py pick 2)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install scikit-learn==1.6.1
      - name: Similarity check
        id: similarity
        env:
          TASK_PATH: ${{ inputs.task_path }}
        run: |
          if OUTPUT=$(python3 base/ci_checks/check-similarity.py "pr/$TASK_PATH" base/tasks 2>&1); then
            echo "success=true" >> "$GITHUB_OUTPUT"; echo "✅ $OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"; echo "❌ $OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Static checks passed on this commit
        id: static
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=static-checks&per_page=100" \
            --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // "missing"' || echo missing)
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          if [ "$CONCLUSION" = success ]; then echo "✅ static checks: success" >> "$GITHUB_STEP_SUMMARY"
          else echo "❌ static checks: $CONCLUSION (fix them, or comment /check, before /validate)" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: GPU tier preflight (no GPU host)
        id: preflight
        env:
          TASK_PATH: ${{ inputs.task_path }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TIER: ${{ inputs.tier }}
        run: |
          # No pipe here: the step's result is preflight.py's exit status.
          if python base/tools/isaac-remote/preflight.py --task-repo pr --sha "$HEAD_SHA" --task-path "$TASK_PATH" \
               --tier "$TIER" --output work/preflight.json > preflight.txt 2>&1; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi
          cat preflight.txt
          cat preflight.txt >> "$GITHUB_STEP_SUMMARY"
      # Stage gate: only a revision that passed every check above is installed on the pool.
      - name: Verify stage result
        id: verify
        env:
          STATIC: ${{ steps.static.outputs.conclusion }}
          SIMILARITY: ${{ steps.similarity.outputs.success }}
          PREFLIGHT: ${{ steps.preflight.outputs.success }}
        run: |
          FAILED=""
          [ "$STATIC" = success ] || FAILED="${FAILED}static checks are '$STATIC' on this commit (fix them or comment /check first); "
          [ "$SIMILARITY" = true ] || FAILED="${FAILED}similarity check failed; "
          [ "$PREFLIGHT" = true ] || FAILED="${FAILED}GPU tier preflight failed: $(grep '^❌' preflight.txt | tr '\n' ' '); "
          if [ -z "$FAILED" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            mkdir -p work
            FAILED="$FAILED" python3 -c "import json,os; json.dump({'state':'not_verified','error':'Verify stage failed, so the revision was not deployed: '+os.environ['FAILED']}, open('work/deploy.json','w'))"
          fi
      - name: Open restricted GPU tunnel
        if: steps.verify.outputs.verified == 'true'
        env:
          TUNNEL_KEY: ${{ secrets.PR8_GPU_TUNNEL_KEY }}
          TUNNEL_HOST_KEY: ${{ secrets.PR8_GPU_FAST_TUNNEL_HOST_KEY }}
          TRANSPORT_TOKEN: ${{ secrets.PR8_GPU_TRANSPORT_TOKEN }}
        run: bash base/tools/isaac-remote/tunnel.sh open
      - name: Install the task revision on the GPU host
        id: deploy
        if: steps.verify.outputs.verified == 'true'
        env:
          TASK_PATH: ${{ inputs.task_path }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if python base/tools/isaac-remote/deploy_task.py --task-repo pr --sha "$HEAD_SHA" \
               --task-path "$TASK_PATH" --token-file "$RUNNER_TEMP/ziwu-transport/token" \
               --output work/deploy.json; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Close transport
        if: always()
        run: bash base/tools/isaac-remote/tunnel.sh close
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-deploy-${{ steps.slug.outputs.slug }}
          path: |
            work/deploy.json
            work/preflight.json
          if-no-files-found: ignore
          retention-days: 30

  lanes:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    strategy:
      fail-fast: false
      matrix:
        gpu: ${{ fromJSON(needs.deploy.outputs.lanes) }}
    # The operator's CPU agent image is a draft release asset, which needs write scope to download.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: base, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install pinned host harness
        run: python -m pip install 'harbor==0.23.0'
      - name: Verify CPU image
        working-directory: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cpu-image-input
          gh release download pr8-cpu-image-20261109 --repo "$GITHUB_REPOSITORY" --pattern cpu-image.tar.gz --dir cpu-image-input
          python tools/isaac-model-comparison/cpu_image.py --archive cpu-image-input/cpu-image.tar.gz \
            --sha256 9805cca464f3b273e5832b5989ad0ed2116567b6b3b3acb7788ab316d294d0fa \
            --image-id sha256:efd2f349d4fbaf9ed64ee0339913b8cc51a6b94db237db5a9a50fe602d0b9b10 \
            --output work/cpu-image.json
          rm -rf cpu-image-input
      - name: Open restricted GPU tunnel
        env:
          TUNNEL_KEY: ${{ secrets.PR8_GPU_TUNNEL_KEY }}
          TUNNEL_HOST_KEY: ${{ secrets.PR8_GPU_FAST_TUNNEL_HOST_KEY }}
          TRANSPORT_TOKEN: ${{ secrets.PR8_GPU_TRANSPORT_TOKEN }}
        run: bash base/tools/isaac-remote/tunnel.sh open
      # The two controls of one lane run one after the other: the host queue
      # expires a job that waits more than ten minutes behind its own lane.
      - name: Oracle
        continue-on-error: true
        env:
          TASK_PATH: ${{ inputs.task_path }}
          HEAD_SHA: ${{ inputs.head_sha }}
          GPU: ${{ matrix.gpu }}
          TIER: ${{ inputs.tier }}
        run: |
          python base/tools/isaac-remote/run.py --harness oracle --gpu "$GPU" --task-path "$TASK_PATH" --tier "$TIER" \
            --task-repo pr --source-sha "$HEAD_SHA" --request-id "validate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GPU-oracle" \
            --token-file "$RUNNER_TEMP/ziwu-transport/token" --output "comparison-output/oracle-gpu$GPU-1"
      - name: Nop
        continue-on-error: true
        env:
          TASK_PATH: ${{ inputs.task_path }}
          HEAD_SHA: ${{ inputs.head_sha }}
          GPU: ${{ matrix.gpu }}
          TIER: ${{ inputs.tier }}
        run: |
          python base/tools/isaac-remote/run.py --harness nop --gpu "$GPU" --task-path "$TASK_PATH" --tier "$TIER" \
            --task-repo pr --source-sha "$HEAD_SHA" --request-id "validate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GPU-nop" \
            --token-file "$RUNNER_TEMP/ziwu-transport/token" --output "comparison-output/nop-gpu$GPU-1"
      - name: Confirm remote cleanup
        if: always()
        run: |
          if test -S "$RUNNER_TEMP/ziwu-transport/socket"; then
            python base/tools/isaac-remote/cleanup.py --output comparison-output --token-file "$RUNNER_TEMP/ziwu-transport/token"
          fi
      - name: Close transport
        if: always()
        run: bash base/tools/isaac-remote/tunnel.sh close
      - name: Show measured results
        if: always()
        run: python base/tools/isaac-remote/report.py --output comparison-output >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-controls-${{ needs.deploy.outputs.slug }}-gpu${{ matrix.gpu }}
          path: |
            base/work/
            comparison-output/
          retention-days: 30

  accept:
    needs: [deploy, lanes]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: base, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.head_sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          pattern: gpu-*-${{ needs.deploy.outputs.slug }}*
          path: downloaded
      - name: Accept the four controls
        env:
          TASK_PATH: ${{ inputs.task_path }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SIMILARITY: ${{ needs.deploy.outputs.similarity }}
          SLUG: ${{ needs.deploy.outputs.slug }}
          LANES: ${{ needs.deploy.outputs.lanes }}
        run: |
          TREE=$(git -C pr rev-parse "$HEAD_SHA:$TASK_PATH")
          python base/tools/isaac-remote/validate_report.py --task-path "$TASK_PATH" --task-tree "$TREE" \
            --similarity "${SIMILARITY:-false}" --deploy "downloaded/gpu-deploy-$SLUG/deploy.json" \
            --controls downloaded --results validation-results --evidence "acceptance/$SLUG.json" --lanes "$LANES" \
            >> "$GITHUB_STEP_SUMMARY"
      # Same artifact prefix as validate-task.yml's execution-checks, so the
      # shared renderer and the execution-checks gate pick this row up.
      - uses: actions/upload-artifact@v4
        with:
          name: execution-gpu-${{ needs.deploy.outputs.slug }}
          path: validation-results/
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-acceptance-${{ needs.deploy.outputs.slug }}
          path: acceptance/
          if-no-files-found: ignore
          retention-days: 90
